<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Insumos - Secretaria de Saúde</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header Enxuto -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-2xl font-bold">Solicitação de Materiais da Saúde</h1>
        <p class="text-emerald-100 text-sm">Formulário Oficial de Pedidos ao Almoxarifado</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">Identificação da Solicitação</h2>
            
            <!-- Dados do Solicitante e Setor -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">Solicitante / Retirante</label>
                        <button onclick="alternarModoManual('solicitante')" class="text-xs text-blue-600 hover:underline">Alternar modo manual</button>
                    </div>
                    <select id="solicitanteSelect" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">Carregando solicitantes...</option>
                    </select>
                    <input type="text" id="solicitanteInput" placeholder="Digite o nome (Ex: Atendimento Presencial)" class="hidden w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-slate-700">Setor de Destino</label>
                        <button onclick="alternarModoManual('setor')" class="text-xs text-blue-600 hover:underline">Alternar modo manual</button>
                    </div>
                    <select id="setorSelect" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">Carregando setores...</option>
                    </select>
                    <input type="text" id="setorInput" placeholder="Digite o setor (Ex: Secretaria de Obras)" class="hidden w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
            </div>

            <!-- Adicionar Item ao Carrinho -->
            <div class="border-t pt-4">
                <h3 class="text-sm font-semibold text-slate-600 mb-3 uppercase tracking-wider">Adicionar Itens ao Pedido</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Área</label>
                        <select id="areaSolic" onchange="atualizarInsumosSolicSelect()" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
                            <option value="">Selecione a Área</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Papelaria">Papelaria</option>
                            <option value="Enfermagem">Enfermagem</option>
                            <option value="Odonto">Odonto</option>
                            <option value="Ambulância">Ambulância</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Insumo</label>
                        <select id="insumoSolic" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
                            <option value="">Selecione a área primeiro</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Quantidade</label>
                        <input type="number" id="qtdSolic" min="1" placeholder="Ex: 5" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none">
                    </div>

                    <div>
                        <button onclick="adicionarAoCarrinho()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2 rounded-lg text-sm transition shadow">
                            ➕ Adicionar ao Pedido
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabela do Carrinho -->
            <div class="mt-6">
                <h3 class="text-sm font-semibold text-slate-600 mb-2">Itens Selecionados no Pedido:</h3>
                <div class="overflow-x-auto border border-slate-200 rounded-lg">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-100 text-slate-600 text-xs uppercase">
                            <tr>
                                <th class="p-3 border-b">Área</th>
                                <th class="p-3 border-b">ID</th>
                                <th class="p-3 border-b">Insumo</th>
                                <th class="p-3 border-b">Unidade</th>
                                <th class="p-3 border-b">Quantidade</th>
                                <th class="p-3 border-b text-center">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="carrinhoBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-slate-400">Nenhum item adicionado ao pedido ainda.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Botão Enviar Solicitação -->
            <div class="mt-6 flex justify-end">
                <button onclick="enviarSolicitacao()" id="btnEnviarSolic" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg transition shadow">
                    🚀 Enviar Solicitação para Aprovação
                </button>
            </div>
            <div id="msgFeedbackSolic" class="mt-3 text-sm text-center font-medium"></div>
        </div>
    </main>

    <!-- JavaScript do Solicitante -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxjjvmue6hLrce7QrVK5fankq_g8w6H3epAIR8MRJTyzS-CPncB8YOr46ndyj4Uhj7iRw/exec";

        let dadosGlobais = {};
        let carrinhoItens = [];
        let modoManualSolicitante = false;
        let modoManualSetor = false;

        async function carregarDados() {
            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();
                if(result.status === "success") {
                    dadosGlobais = result;
                    popularesSelectsAuxiliares();
                } else {
                    alert("Erro ao carregar dados: " + result.message);
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
            }
        }

        function popularesSelectsAuxiliares() {
            const selSol = document.getElementById("solicitanteSelect");
            selSol.innerHTML = '<option value="">Selecione o Solicitante</option>';
            (dadosGlobais.solicitantes || []).forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                selSol.appendChild(opt);
            });

            const selSet = document.getElementById("setorSelect");
            selSet.innerHTML = '<option value="">Selecione o Setor</option>';
            (dadosGlobais.setores || []).forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                selSet.appendChild(opt);
            });
        }

        function alternarModoManual(tipo) {
            if (tipo === 'solicitante') {
                modoManualSolicitante = !modoManualSolicitante;
                document.getElementById('solicitanteSelect').classList.toggle('hidden', modoManualSolicitante);
                document.getElementById('solicitanteInput').classList.toggle('hidden', !modoManualSolicitante);
            } else {
                modoManualSetor = !modoManualSetor;
                document.getElementById('setorSelect').classList.toggle('hidden', modoManualSetor);
                document.getElementById('setorInput').classList.toggle('hidden', !modoManualSetor);
            }
        }

        function atualizarInsumosSolicSelect() {
            const area = document.getElementById("areaSolic").value;
            const select = document.getElementById("insumoSolic");
            select.innerHTML = '<option value="">Selecione o Insumo</option>';

            if(!area || !dadosGlobais.data[area]) return;

            dadosGlobais.data[area].forEach(item => {
                const option = document.createElement("option");
                option.value = item.ID_Insumo;
                option.textContent = `${item.ID_Insumo} - ${item.Nome}`;
                select.appendChild(option);
            });
        }

        function adicionarAoCarrinho() {
            const area = document.getElementById("areaSolic").value;
            const idInsumo = document.getElementById("insumoSolic").value;
            const quantidade = Number(document.getElementById("qtdSolic").value);

            if (!area || !idInsumo || !quantidade || quantidade <= 0) {
                alert("Selecione a área, o insumo e informe uma quantidade válida.");
                return;
            }

            const itemCadastrado = dadosGlobais.data[area].find(i => String(i.ID_Insumo) === String(idInsumo));
            if (!itemCadastrado) return;

            carrinhoItens.push({
                area: area,
                idInsumo: idInsumo,
                nome: itemCadastrado.Nome,
                unidade: itemCadastrado.Unidade_Base,
                quantidade: quantidade
            });

            renderizarCarrinho();
            document.getElementById("qtdSolic").value = "";
        }

        function removerDoCarrinho(index) {
            carrinhoItens.splice(index, 1);
            renderizarCarrinho();
        }

        function renderizarCarrinho() {
            const tbody = document.getElementById("carrinhoBody");
            tbody.innerHTML = "";

            if (carrinhoItens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Nenhum item adicionado ao pedido ainda.</td></tr>`;
                return;
            }

            carrinhoItens.forEach((item, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="p-3 border-b">${item.area}</td>
                    <td class="p-3 border-b font-medium">${item.idInsumo}</td>
                    <td class="p-3 border-b">${item.nome}</td>
                    <td class="p-3 border-b">${item.unidade}</td>
                    <td class="p-3 border-b font-bold text-emerald-700">${item.quantidade}</td>
                    <td class="p-3 border-b text-center">
                        <button onclick="removerDoCarrinho(${idx})" class="text-red-600 hover:text-red-800 font-bold">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function enviarSolicitacao() {
            const solicitante = modoManualSolicitante ? document.getElementById("solicitanteInput").value : document.getElementById("solicitanteSelect").value;
            const setor = modoManualSetor ? document.getElementById("setorInput").value : document.getElementById("setorSelect").value;
            const feedback = document.getElementById("msgFeedbackSolic");
            const btn = document.getElementById("btnEnviarSolic");

            if (!solicitante || !setor || carrinhoItens.length === 0) {
                alert("Preencha o solicitante, o setor e adicione pelo menos um item ao pedido.");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Enviando...";

            const payload = {
                action: "CRIAR_SOLICITACAO",
                solicitante: solicitante,
                setor: setor,
                itens: carrinhoItens
            };

            try {
                const response = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
                const result = await response.json();

                if (result.status === "success") {
                    feedback.className = "mt-3 text-sm text-center font-medium text-emerald-600";
                    feedback.textContent = result.message;
                    carrinhoItens = [];
                    renderizarCarrinho();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                feedback.className = "mt-3 text-sm text-center font-medium text-red-600";
                feedback.textContent = "Erro: " + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 Enviar Solicitação para Aprovação";
            }
        }

        carregarDados();
    </script>
</body>
</html>
